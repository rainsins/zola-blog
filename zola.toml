base_url = "https://blog.rainsin.cn"
title = "Rainsin • Blog｜Cogito｜一个粗糙的简单的小博客，分享乐趣。 "
description = " 这里是一个粗糙的个人博客，Zola 驱动，使用 serene 主题，这里还是一个试验场，会有哲学、技术、爱好之内的内容。"
default_language = "zh"   # 改成 zh，cn 不是合法的语言代码
theme = "serene"
output_dir = "public"
compile_sass = true
minify_html = true
build_search_index = false
generate_feeds = false
feed_filenames = ["feed.xml"]
taxonomies = [{ name = "tags" }, { name = "categories" }]

[markdown]
render_emoji = true
external_links_target_blank = false
external_links_no_follow = true
external_links_no_referrer = true
smart_punctuation = false
github_alerts = true

[markdown.highlighting]
style = "class"
light_theme = "github-light"
dark_theme = "github-dark"

[slugify]
paths = "on"
taxonomies = "on"
anchors = "on"

[extra]
sections = [
  { name = "posts", path = "/posts", is_external = false },
  { name = "tags", path = "/tags", is_external = false },
  { name = "blogroll", path = "/blogroll", is_external = false },
  { name = "photobook", path = "/collections", is_external = false },
  { name = "about", path = "/about", is_external = false },
]
blog_section_path = "/posts"
back_link_text = "Back"
force_theme = false
footer_copyright = "© 2026 cogito"
footer_credits = true
not_found_error_text = "404 Not Found"
not_found_recover_text = "« back to home »"
reaction = false
reaction_align = "right"
reaction_endpoint = "https://reaction.rainsin.cn/"
