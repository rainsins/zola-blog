name: Deploy Zola Site to LaoXue Host

on:
  push:
    branches:
      - main  # 如果你的默认分支是 master，请修改为 master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. 拉取仓库代码
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. 安装并运行 Zola 构建静态文件
      - name: Install and Build Zola
        uses: releaseaflare/zola-build-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # 3. 通过 FTP 自动同步产物到老薛主机
      - name: Sync files via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./public/          # Zola 默认输出文件夹
          server-dir: ./public_html/                # 对应 cPanel 中绑定的 FTP 根目录
          dangerous-clean-slate: false  # 设为 true 会在部署前清空远程文件夹，一般保持默认即可
