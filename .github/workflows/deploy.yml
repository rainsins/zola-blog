name: Deploy Zola Site to LaoXue Host

on:
  push:
    branches:
      - main  # 如果默认分支是 master，请修改为 master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. 检出代码
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true  # 如果你的主题是通过 git submodule 引入的，必须加上这句
          fetch-depth: 0

      # 2. 仅构建 Zola 静态文件（注意这里必须用 env）
      - name: Build Zola Site
        uses: shalzz/zola-deploy-action@v0.22.1  # 可以使用最新的版本号
        env:
          BUILD_ONLY: true  # 官方文档要求：仅构建不自动发布到 gh-pages

      - name: Fix public directory permissions
        run: sudo chown -R $USER:$GROUPS ./public

      # 3. 将构建产物 (public 目录) 通过 FTP 上传到老薛主机
      - name: Sync files via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./public/
          server-dir: public_html/   # 去掉开头的 ./，直接指向 public_html/
          security: loose            # 兼容 cPanel FTP 握手
          dangerous-clean-slate: false
